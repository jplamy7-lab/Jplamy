version: '3.8'

services:
  agent-swarm:
    build: .
    container_name: private-orchestrator-115
    environment:
      - SERVER_IP=192.168.1.115
      - LLM_ENDPOINT=http://ollama:11434/api/generate
    depends_on:
      - ollama
    networks:
      - private-lan

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-local-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - private-lan
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  private-lan:
    driver: bridge

volumes:
  ollama_models:
